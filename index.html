```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VISIONS.AI — Video Stüdyo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="topbar">
  <div class="brand">VISIONS<span class="brand-dot">.</span>AI</div>
  <div class="topbar-center">
    <span class="topbar-tag">Luma Dream Machine</span>
  </div>
  <div class="topbar-right">
    <div class="credit-chip" id="creditChip">
      <span class="dot dot-gray"></span>
      <span id="creditText">API bağlı</span>
    </div>
  </div>
</div>

<div class="layout">

  <div class="panel panel-form">

    <div class="api-box" id="apiBox">
      <div class="api-box-head">
        <span class="api-icon">🔑</span>
        <span class="api-title">Luma API Anahtarı</span>
        <span class="free-badge">ÜCRETSİZ</span>
      </div>
      <div class="api-input-row">
        <input type="password" id="apiKey" placeholder="luma-xxxxxxxxxxxxxxxx"/>
        <button class="icon-btn" onclick="toggleKey()">👁</button>
        <a href="https://lumalabs.ai/dream-machine/api" target="_blank" class="link-btn">Al →</a>
      </div>
    </div>

    <div class="field">
      <label class="field-label">Sahne Açıklaması</label>
      <textarea id="prompt" rows="5" placeholder="Video promptu gir..."></textarea>
    </div>

    <div class="field">
      <label class="field-label">En-Boy Oranı</label>
      <div class="pill-row" id="ratioGroup">
        <button class="pill active" data-val="16:9">16:9</button>
        <button class="pill" data-val="9:16">9:16</button>
        <button class="pill" data-val="1:1">1:1</button>
      </div>
    </div>

    <div class="field">
      <label class="field-label">Klip Döngüsü</label>
      <div class="pill-row" id="loopGroup">
        <button class="pill active" data-val="false">Kapalı</button>
        <button class="pill" data-val="true">Açık</button>
      </div>
    </div>

    <button class="gen-btn" onclick="startGeneration()">
      Video Üretimini Başlat
    </button>

  </div>

  <div class="panel panel-status">

    <div id="idleState" class="idle-state">
      <div class="idle-title">Üretim bekleniyor</div>
    </div>

    <div id="progressState" style="display:none">
      <div class="status-title">Video oluşturuluyor...</div>
    </div>

    <div id="resultState" style="display:none">
      <div id="videoPlayer"></div>

      <div class="result-actions">
        <button class="act-btn act-primary" id="dlBtn">
          ⬇ İndir
        </button>
      </div>
    </div>

  </div>
</div>

<script>
const API_URL = "https://ai-video-api.alyux.workers.dev/";

document.querySelectorAll(".pill-row").forEach(group => {
  const pills = group.querySelectorAll(".pill");

  pills.forEach(btn => {
    btn.addEventListener("click", () => {
      pills.forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
    });
  });
});

function toggleKey() {
  const input = document.getElementById("apiKey");
  input.type = input.type === "password" ? "text" : "password";
}

function getSelectedRatio() {
  const active = document.querySelector("#ratioGroup .pill.active");
  return active ? active.dataset.val : "16:9";
}

function getLoopValue() {
  const active = document.querySelector("#loopGroup .pill.active");
  return active ? active.dataset.val === "true" : false;
}

async function startGeneration() {
  const apiKey = document.getElementById("apiKey").value.trim();
  const prompt = document.getElementById("prompt").value.trim();

  if (!apiKey || !prompt) {
    alert("API anahtarı ve prompt gerekli");
    return;
  }

  document.getElementById("idleState").style.display = "none";
  document.getElementById("progressState").style.display = "block";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        apiKey,
        prompt,
        aspect_ratio: getSelectedRatio(),
        loop: getLoopValue()
      })
    });

    const data = await response.json();

    if (data.video_url) {
      showResult(data.video_url);
    } else {
      console.log(data);
      alert("Video üretilemedi");
    }

  } catch (err) {
    console.error(err);
    alert("API bağlantı hatası");
  }
}

function showResult(videoUrl) {
  document.getElementById("progressState").style.display = "none";
  document.getElementById("resultState").style.display = "block";

  const player = document.getElementById("videoPlayer");

  player.innerHTML = `
    <video controls autoplay style="width:100%;border-radius:16px">
      <source src="${videoUrl}" type="video/mp4">
    </video>
  `;

  document.getElementById("dlBtn").onclick = () => {
    window.open(videoUrl, "_blank");
  };
}
</script>

</body>
</html>
```
