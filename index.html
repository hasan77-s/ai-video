<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Video Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#050508;--card:#0d0d12;--border:#1a1a24;--text:#e2e2e8;--muted:#6b6b7b;--primary:#6320ff;--cyan:#00d4ff}
  *{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
  .badge{display:inline-flex;padding:6px 16px;border-radius:20px;border:1px solid rgba(99,32,255,0.4);background:rgba(99,32,255,0.1);font-size:12px;color:#a78bfa;margin-bottom:16px}
  h1{font-size:clamp(28px,5vw,56px);font-weight:900;background:linear-gradient(90deg,#a78bfa,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
  .sub{color:var(--muted);margin-bottom:32px;font-size:15px}
  .box{width:100%;max-width:600px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
  label{display:block;font-size:12px;color:#a78bfa;margin-bottom:8px;font-weight:600}
  textarea{width:100%;background:#0a0a10;border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);font-size:14px;resize:vertical;outline:none;font-family:inherit}
  textarea:focus{border-color:rgba(99,32,255,0.6)}
  .btn{width:100%;padding:16px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--cyan));color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:8px;transition:0.2s}
  .btn:hover{filter:brightness(1.1)}.btn:disabled{background:#2a2a35;color:#6b6b7b;cursor:not-allowed}
  .progress{display:none;text-align:center;margin-bottom:16px}.progress.show{display:block}
  .pct{font-size:36px;font-weight:900;background:linear-gradient(90deg,#a78bfa,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .bar{width:100%;height:6px;background:#1a1a24;border-radius:6px;overflow:hidden;margin:12px 0}
  .fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--cyan));width:0%;transition:0.4s}
  .status{font-size:13px;color:var(--muted);margin-top:6px}
  .result{display:none;text-align:center}.result.show{display:block}
  video{width:100%;border-radius:12px;margin-bottom:12px;background:#000}
  .actions{display:flex;gap:10px}.act{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-weight:600}
  .act.primary{background:linear-gradient(135deg,var(--primary),var(--cyan));border:none;color:#fff}
  .err{background:rgba(255,32,80,0.1);border:1px solid rgba(255,32,80,0.3);color:#ff6b9d;padding:12px;border-radius:10px;margin-bottom:16px;display:none;font-size:13px}
  .err.show{display:flex;align-items:center;gap:8px}
</style>
</head>
<body>
<div class="badge">AI VIDEO GENERATOR</div>
<h1>أنشئ فيديوهات خرافية</h1>
<div class="sub">دقة عالية • حركة سلسة • بدون علامة مائية</div>

<div class="err" id="err">⚠ <span id="errMsg"></span></div>

<div class="progress" id="prog"><div class="pct" id="pct">0%</div><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="step">جارٍ التحليل...</div></div>

<div class="result" id="res"><video id="vid" controls autoplay loop muted playsinline></video>
<div class="actions">
  <button class="act primary" onclick="dl()">⬇ تحميل</button>
  <button class="act" onclick="share()"> مشاركة</button>
  <button class="act" onclick="resetUI()">↺ إعادة</button>
</div></div>

<div class="box"><label>◈ وصف الفيديو</label><textarea id="prompt" rows="4" placeholder="اكتب الوصف بالإنجليزية... مثال: A cyberpunk city at night, rain, neon lights, cinematic"></textarea></div>
<button class="btn" id="genBtn" onclick="start()">✦ توليد الفيديو</button>

<script>
const API="https://ai-video-api.alyux.workers.dev";
let busy=false,poll=null,vidUrl=null;

function showErr(m){document.getElementById("errMsg").textContent=m;document.getElementById("err").classList.add("show");}
function hideErr(){document.getElementById("err").classList.remove("show");}
function showEl(id){document.getElementById(id).classList.add("show");}
function hideEl(id){document.getElementById(id).classList.remove("show");}

async function start(){
  const p=document.getElementById("prompt").value.trim();
  hideErr();hideEl("res");
  if(!p)return showErr("الرجاء إدخال وصف للفيديو");
  if(busy)return;
  busy=true;const b=document.getElementById("genBtn");b.disabled=true;b.textContent="جارٍ المعالجة...";
  showEl("prog");animateProg();
  try{
    const r=await fetch(`${API}/api/generate`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:p})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||"خطأ في الاتصال");
    startPoll(d.id);
  }catch(e){hideEl("prog");showErr(e.message);resetBtn();}
}

function animateProg(){let v=0;const t=setInterval(()=>{v+=5;if(v>30){clearInterval(t);return;}document.getElementById("pct").textContent=v+"%";document.getElementById("fill").style.width=v+"%";},300);}

function startPoll(id){
  poll=setInterval(async()=>{
    try{
      const r=await fetch(`${API}/api/status?id=${id}`);const d=await r.json();
      if(d.status==="succeeded"){clearInterval(poll);finish(d.video_url);}
      else if(d.status==="failed"){clearInterval(poll);hideEl("prog");showErr("فشلت العملية. حاول مرة أخرى.");resetBtn();}
      else{const v=Math.min(95,Math.round(Math.random()*20+60));document.getElementById("pct").textContent=v+"%";document.getElementById("fill").style.width=v+"%";}
    }catch(e){console.error(e);}
  },4000);
}

function finish(url){
  document.getElementById("pct").textContent="100%";document.getElementById("fill").style.width="100%";
  setTimeout(()=>{hideEl("prog");showEl("res");vidUrl=url;document.getElementById("vid").src=url;resetBtn();},800);
}

function resetBtn(){busy=false;const b=document.getElementById("genBtn");b.disabled=false;b.textContent="✦ توليد الفيديو";}
function resetUI(){hideEl("res");hideErr();document.getElementById("prompt").value="";resetBtn();}
function dl(){if(vidUrl){const a=document.createElement("a");a.href=vidUrl;a.download="video.mp4";a.click();}}
function share(){if(navigator.share&&vidUrl)navigator.share({title:"AI Video",url:vidUrl});else if(vidUrl){navigator.clipboard.writeText(vidUrl);alert("تم نسخ الرابط!");}}

// Health Check
fetch(`${API}/api/health`).then(r=>{if(!r.ok)showErr("API غير متصل. تحقق من الإعدادات.");}).catch(()=>showErr("API غير متصل. تحقق من الإعدادات."));
</script>
</body>
</html>
