<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisionAI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}:root{--purple:#6320ff;--cyan:#00d4ff;--bg:#020408;--card:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.07);--text:rgba(255,255,255,0.85);--muted:rgba(255,255,255,0.4)}
  html{scroll-behavior:smooth}body{background:var(--bg);color:var(--text);font-family:'Outfit','Cairo',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
  .bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(99,32,255,0.25) 0%,transparent 60%)}
  .content{position:relative;z-index:1}nav{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid rgba(99,32,255,0.2);background:rgba(2,4,8,0.85);backdrop-filter:blur(20px);position:sticky;top:0;z-index:100}
  .logo{display:flex;align-items:center;gap:12px}.logo-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--purple),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:20px}
  .logo-name{font-size:17px;font-weight:900;background:linear-gradient(90deg,#a78bfa,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.logo-sub{font-size:10px;color:var(--muted)}
  .hero{text-align:center;padding:56px 24px 40px}.badge{display:inline-flex;padding:6px 18px;border-radius:20px;border:1px solid rgba(99,32,255,0.4);background:rgba(99,32,255,0.1);font-size:11px;color:#a78bfa;margin-bottom:18px}
  .hero-title{font-size:clamp(32px,6vw,68px);font-weight:900;background:linear-gradient(135deg,#fff,#a78bfa,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:14px}
  .hero-sub{font-size:15px;color:var(--muted);margin-bottom:28px}
  main{max-width:900px;margin:0 auto;padding:0 20px 80px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;margin-bottom:16px}
  .card-label{font-size:11px;font-weight:800;color:#a78bfa;margin-bottom:10px;display:block}
  textarea{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(99,32,255,0.3);border-radius:12px;padding:14px;color:var(--text);font-size:14px;resize:vertical;outline:none;font-family:inherit;line-height:1.6}
  .gen-btn{width:100%;padding:18px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--purple),var(--cyan));color:#fff;font-size:17px;font-weight:900;cursor:pointer;margin-top:16px}
  .gen-btn:hover{filter:brightness(1.1)}.gen-btn:disabled{background:rgba(255,255,255,0.1);color:var(--muted);cursor:not-allowed}
  .progress-card{background:rgba(99,32,255,0.05);border:1px solid rgba(99,32,255,0.3);border-radius:18px;padding:28px;margin-bottom:16px;text-align:center;display:none}
  .progress-card.show{display:block}.progress-pct{font-size:48px;font-weight:900;background:linear-gradient(90deg,#a78bfa,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .progress-bar{width:100%;height:6px;background:rgba(255,255,255,0.1);border-radius:10px;overflow:hidden;margin:16px 0}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:10px;width:0%;transition:width .5s}
  .progress-step{font-size:13px;color:var(--muted);margin-top:8px}
  .result-card{background:rgba(99,32,255,0.06);border:1px solid rgba(99,32,255,0.35);border-radius:18px;padding:24px;margin-bottom:16px;display:none}
  .result-card.show{display:block}.video-preview{width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;margin:16px 0;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer}
  video{width:100%;height:100%;object-fit:cover}
  .action-row{display:flex;gap:10px}.action-btn{flex:1;padding:12px;border-radius:10px;border:none;background:rgba(255,255,255,0.05);color:#fff;cursor:pointer;font-weight:700}
  .action-btn.primary{background:linear-gradient(135deg,var(--purple),var(--cyan))}
  .error-box{background:rgba(255,32,80,0.1);border:1px solid rgba(255,32,80,0.3);border-radius:12px;padding:16px;color:#ff6b9d;margin-bottom:16px;display:none}
  .error-box.show{display:block}
  .api-status{display:flex;align-items:center;gap:8px;font-size:11px;padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.08)}
  .status-dot{width:7px;height:7px;border-radius:50%}.status-dot.online{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,0.6)}.status-dot.offline{background:#ef4444}
  @media(max-width:600px){nav{padding:12px 16px}.hero{padding:40px 16px 28px}main{padding:0 14px 60px}.card{padding:18px}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="content">
<nav>
  <div class="logo"><div class="logo-icon">⬡</div><div><div class="logo-name">VISIONAI STUDIO</div><div class="logo-sub">منصة توليد الفيديو بالذكاء الاصطناعي</div></div></div>
  <div class="api-status"><div class="status-dot online" id="statusDot"></div><span id="statusText">API متصل</span></div>
</nav>
<div class="hero"><div class="badge">AI VIDEO GENERATOR</div><div class="hero-title" id="heroTitle">أنشئ فيديوهات خرافية</div><div class="hero-sub" id="heroSub">دقة عالية • حركة سلسة • بدون علامة مائية</div></div>
<main>
  <div class="progress-card" id="progressCard"><div class="progress-pct" id="progressPct">0%</div><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div><div class="progress-step" id="progressStep">جارٍ التحليل...</div></div>
  <div class="error-box" id="errorBox">⚠ <span id="errorMsg"></span></div>
  <div class="result-card" id="resultCard"><div style="font-size:12px;color:#a78bfa;margin-bottom:4px">✦ الفيديو جاهز!</div><div style="font-size:14px;color:var(--muted);margin-bottom:16px">تم التوليد بنجاح</div>
    <div class="video-preview" id="videoPreview"><video id="videoPlayer" controls autoplay loop muted playsinline></video></div>
    <div class="action-row">
      <button class="action-btn primary" onclick="downloadVideo()">⬇ تحميل</button>
      <button class="action-btn" onclick="shareVideo()">🔗 مشاركة</button>
      <button class="action-btn" onclick="resetUI()">↺ إعادة</button>
    </div>
  </div>
  <div class="card"><span class="card-label">◈ وصف الفيديو</span><textarea id="promptInput" rows="4" placeholder="اكتب وصف الفيديو بالإنجليزية... مثال: A cyberpunk city at night, rain, neon lights, cinematic camera movement"></textarea></div>
  <button class="gen-btn" id="genBtn" onclick="doGenerate()">✦ توليد الفيديو</button>
</main>
</div>

<script>
const WORKER_URL = "https://ai-video-api.alyux.workers.dev";
let isGenerating = false, currentVideoUrl = null, pollInterval = null;

async function doGenerate(){
  const prompt = document.getElementById("promptInput").value.trim();
  hideEl("errorBox"); hideEl("resultCard");
  if(!prompt) return showError("الرجاء إدخال وصف للفيديو");
  if(isGenerating) return;
  
  isGenerating = true;
  const btn = document.getElementById("genBtn");
  btn.disabled = true; btn.textContent = "جارٍ التوليد...";
  showEl("progressCard"); animateProgress();

  try {
    const res = await fetch(`${WORKER_URL}/api/generate`, {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ prompt })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || "خطأ في API");
    startPolling(data.id);
  } catch(err){
    hideEl("progressCard"); showError(err.message); resetBtn();
  }
}

function startPolling(id){
  if(pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async ()=>{
    try {
      const res = await fetch(`${WORKER_URL}/api/status?id=${id}`);
      const data = await res.json();
      if(data.status === "succeeded"){
        clearInterval(pollInterval); finishGenerate(data.video_url);
      } else if(data.status === "failed"){
        clearInterval(pollInterval); hideEl("progressCard"); showError("فشل التوليد. حاول مرة أخرى."); resetBtn();
      } else {
        const pct = Math.min(95, Math.round(Math.random()*20 + 60));
        document.getElementById("progressPct").textContent = pct + "%";
        document.getElementById("progressFill").style.width = pct + "%";
      }
    } catch(e){ console.error(e); }
  }, 4000);
}

function animateProgress(){
  let p=0; const t=setInterval(()=>{
    p+=5; if(p>30){clearInterval(t);return;}
    document.getElementById("progressPct").textContent=p+"%";
    document.getElementById("progressFill").style.width=p+"%";
    document.getElementById("progressStep").textContent="جارٍ التحليل...";
  },300);
}

function finishGenerate(url){
  document.getElementById("progressPct").textContent="100%";
  document.getElementById("progressFill").style.width="100%";
  setTimeout(()=>{
    hideEl("progressCard"); showEl("resultCard");
    currentVideoUrl = url;
    document.getElementById("videoPlayer").src = url;
    resetBtn();
  },800);
}

function resetUI(){ hideEl("resultCard"); hideEl("errorBox"); document.getElementById("promptInput").value=""; resetBtn(); }
function resetBtn(){ isGenerating=false; const b=document.getElementById("genBtn"); b.disabled=false; b.textContent="✦ توليد الفيديو"; if(pollInterval)clearInterval(pollInterval); }
function downloadVideo(){ if(currentVideoUrl){const a=document.createElement("a");a.href=currentVideoUrl;a.download="visionai.mp4";a.click();} }
function shareVideo(){ if(navigator.share&&currentVideoUrl)navigator.share({title:"VisionAI",url:currentVideoUrl}); else if(currentVideoUrl){navigator.clipboard.writeText(currentVideoUrl);alert("تم نسخ الرابط!");} }
function showEl(id){document.getElementById(id).classList.add("show");}
function hideEl(id){document.getElementById(id).classList.remove("show");}
function showError(msg){document.getElementById("errorMsg").textContent=msg;showEl("errorBox");}

// Health Check
fetch(`${WORKER_URL}/api/health`).then(r=>{
  if(r.ok){document.getElementById("statusDot").className="status-dot online";document.getElementById("statusText").textContent="API متصل";}
  else{document.getElementById("statusDot").className="status-dot offline";document.getElementById("statusText").textContent="API غير متصل";}
}).catch(()=>{document.getElementById("statusDot").className="status-dot offline";});
</script>
</body>
</html>
